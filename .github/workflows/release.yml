name: Release

# Tag-triggered bundle → GitHub Release pipeline for the plugin families.
#
# Pushing a `vX.Y.Z` tag builds every family in `scripts/bundle.mjs` and publishes
# a GitHub Release for the tag with one asset per family attached:
#
#   datavis.mjs   the data-presentation directive family
#
# Consumers pin the asset by release URL, which is the only remote form mystmd
# supports — `myst-config` accepts a local path or a URL and nothing else:
#
#   project:
#     plugins:
#       - https://github.com/QuantEcon/quantecon-plugins.mystmd/releases/download/vX.Y.Z/datavis.mjs
#
# That is the estate-wide rule for plugin distribution, decided on
# QuantEcon/workspace-themes#12, and it is why this workflow lands ahead of the
# directive groups rather than with them: downstream repositories need a real URL
# to pin before there is anything worth pinning. See
# QuantEcon/quantecon-plugins.mystmd#7.
#
# Guards, each of which fails the release rather than publishing something wrong:
#   - the tag must match `package.json` `version`
#   - CHANGELOG.md must have a `## [X.Y.Z]` section — it becomes the release notes
#   - the full test suite must pass, including the tests that drive the real myst CLI
#   - the bundle must be byte-identical when built twice

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bundle and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$VERSION — bump package.json (see CONTRIBUTING.md \"Releases\") and re-tag."
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Two stages. The first lifts this version's section out of the file.
          # It ends at the next `## ` heading — or at the block of link-reference
          # definitions Keep a Changelog puts at the foot of the file, which the
          # last section would otherwise swallow, since nothing follows it.
          # The second unwraps hard-wrapped lines: CHANGELOG.md is wrapped for the
          # repository view, but GitHub renders a release body like a comment — a
          # single newline becomes <br> — so wrapped source would show as narrow
          # ragged lines. Indented continuations are joined into their bullet and
          # consecutive "> " lines into one; fenced blocks and nested bullets pass
          # through untouched.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            /^## /                         { flag = 0 }
            /^\[[^]]+\]: /                 { flag = 0 }
            flag
          ' CHANGELOG.md | awk '
            function flush() { if (have) { print buf; have = 0 } }
            /^```/  { flush(); print; infence = !infence; next }
            infence { print; next }
            /^ {2,}[^ ]/ && have && $0 !~ /^ +[-*] / {
              line = $0; sub(/^ +/, "", line); buf = buf " " line; next
            }
            /^> [^ ]/ && have && buf ~ /^> / {
              line = $0; sub(/^> /, "", line); buf = buf " " line; next
            }
            { flush(); buf = $0; have = 1 }
            END { flush() }
          ' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section — add the curated entry (see CONTRIBUTING.md \"Releases\") and re-tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # The plugin tests drive the real CLI, and a release is exactly the moment
      # that matters: the asset published here is what someone else's build will
      # load. The pin is upstream 1.10.1 — the version the QuantEcon fork tracks,
      # which has no published package to install from. CONTRIBUTING.md
      # "Engine constraints" records the gap; bump this pin deliberately.
      - name: Install mystmd
        run: npm install --no-save mystmd@1.10.1

      - name: Add mystmd to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Report versions
        run: |
          node --version
          myst --version

      - name: Full test suite
        run: npm test

      # A release asset is only trustworthy if it is reproducible from source, so
      # build it twice from a clean directory and compare. If the bytes differ,
      # something in the build is non-deterministic and the asset published below
      # is not the file anyone else gets by building this tag.
      #
      # Self-contained on purpose, and worth keeping that way. An earlier draft
      # hashed whatever `npm test` had left in `dist/`, which read as "the
      # published bytes are the ones the suite just tested" — but the suite tests
      # no such thing. Every plugin test bundles into its own temp directory, so
      # the `npm run bundle` at the front of `test:plugin` is a side effect nothing
      # in the suite consumes, and this step was its only reader. Do not
      # re-introduce that coupling.
      - name: The bundle is reproducible
        run: |
          rm -rf dist && npm run bundle
          shasum -a 256 dist/*.mjs > "$RUNNER_TEMP/first.sha"
          rm -rf dist && npm run bundle
          shasum -a 256 dist/*.mjs > "$RUNNER_TEMP/second.sha"
          diff "$RUNNER_TEMP/first.sha" "$RUNNER_TEMP/second.sha"

      # The bundle stamps its own version from package.json. Checking it here
      # closes the loop the tag guard opens: the tag matches package.json, and
      # the bytes about to be published match package.json too.
      - name: The bundle is stamped with this version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for asset in dist/*.mjs; do
            if ! grep -q "^// version: $VERSION\$" "$asset"; then
              echo "::error::$asset carries no \"// version: $VERSION\" banner line — scripts/bundle.mjs did not stamp it."
              exit 1
            fi
          done

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # Every declared family must produce an asset. Unlike the theme repos,
          # nothing here is optional or still to be written, so a missing file is
          # a broken build and not a known gap.
          fail_on_unmatched_files: true
          files: dist/*.mjs
